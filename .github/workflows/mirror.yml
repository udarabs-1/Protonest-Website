
name: Mirror Repositories

on:
  push:
    branches:
      - main
      - test
      - dev

jobs:
  git-mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Remove workflows
        run: |
          rm -rf .github/workflows

      # Configure Git
      - name: Configure Git
        run: |
          git config user.name "udarabs-1"
          git config user.email "kumarasenau@gmail.com"

      - name: Commit changes if needed
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "chore: remove GitHub Actions workflows from mirror"

      # Mirror the main branch
      - name: Mirror Main Branch
        if: github.ref == 'refs/heads/main'
        env:
          TARGET_URL: https://x-access-token:${{ secrets.PRODUCTION_PAT }}@github.com/udarabs-1/Protonest-Website.git
        run: |
          git remote add mirror-main "$TARGET_URL"
          git push mirror-main HEAD:main --force

      # Mirror the test branch to the target main branch
      - name: Mirror Test Branch
        if: github.ref == 'refs/heads/test'
        env:
          TARGET_URL: https://x-access-token:${{ secrets.TEST_PAT }}@github.com/protonestsupport/Protonest-Website.git
        run: |
          git remote add mirror-test "$TARGET_URL"
          git push mirror-test HEAD:main --force

      # Mirror the dev branch to the target dev branch
      - name: Mirror Dev Branch
        if: github.ref == 'refs/heads/dev'
        env:
          TARGET_URL: https://x-access-token:${{ secrets.TEST_PAT }}@github.com/protonestsupport/Protonest-Website.git
        run: |
          git remote add mirror-dev "$TARGET_URL"
          git push mirror-dev HEAD:dev --force
