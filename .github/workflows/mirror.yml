
name: Mirror Repositories

on:
  push:
    branches:
      - main
      - test
      - dev

permissions:
  contents: read

jobs:
  git-mirror:
    runs-on: ubuntu-latest

    steps:
      # Check branch authorization before mirroring
      - name: Check Branch Access
        env:
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "User: $ACTOR"
          echo "Branch: $BRANCH"

          case "$BRANCH" in
            main|test)
              if [[ "$ACTOR" != "udarabs-1" && "$ACTOR" != "shafeekms10" ]]; then
                echo "::error::Unauthorized push to $BRANCH by $ACTOR"
                exit 1
              fi
              ;;
            dev)
              echo "All collaborators can push to dev"
              ;;
            *)
              echo "::error::Unsupported branch"
              exit 1
              ;;
          esac

          echo "Branch access verified"

      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Remove workflows
        run: |
          rm -rf .github/workflows

      # Configure Git
      - name: Configure Git
        run: |
          git config user.name "udarabs-1"
          git config user.email "kumarasenau@gmail.com"

      - name: Commit changes if needed
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "chore: remove GitHub Actions workflows from mirror"

      # Mirror the main branch to main
      - name: Mirror Main Branch
        if: github.ref == 'refs/heads/main'
        env:
          TARGET_URL: https://x-access-token:${{ secrets.PROTONEST_WEBSITE_PAT }}@github.com/udarabs-1/Protonest-Website.git
        run: |
          git remote add mirror-main "$TARGET_URL"
          git push mirror-main HEAD:main --force

      # Mirror the test branch to test
      - name: Mirror Test Branch
        if: github.ref == 'refs/heads/test'
        env:
          TARGET_URL: https://x-access-token:${{ secrets.PROTONEST_WEBSITE_PAT }}@github.com/udarabs-1/Protonest-Website.git
        run: |
          git remote add mirror-test "$TARGET_URL"
          git push mirror-test HEAD:test --force

      # Mirror the dev branch to dev
      - name: Mirror Dev Branch
        if: github.ref == 'refs/heads/dev'
        env:
          TARGET_URL: https://x-access-token:${{ secrets.PROTONEST_WEBSITE_PAT }}@github.com/udarabs-1/Protonest-Website.git
        run: |
          git remote add mirror-dev "$TARGET_URL"
          git push mirror-dev HEAD:dev --force
